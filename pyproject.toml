[project]
name = "edgar"
version = "0.1.2"
description = "A bot for friends and enemies."
authors = [{ name = "SidVeld", email = "sidveld@gmail.com" }]
requires-python = "~=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "rich>=13.9.4",
    "py-cord>=2.6.1",
    "dacite>=1.9.2",
    "python-dotenv>=1.0.0",
    "tortoise-orm[asyncpg]>=0.24.2",
]

[dependency-groups]
dev = [
    "ruff>=0.11.1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
select = ["F", "E", "W", "Q", "RET", "I", "C90", "G", "LOG"]
line-length = 120
